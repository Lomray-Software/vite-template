name: Check example branches

on:
  workflow_dispatch:
  push:
    branches: [ 'example/**' ]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.2
  ENABLE_CACHE: yes

jobs:
  check:
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ github.event_name == 'schedule' && fromJSON('["prod", "example/minimal", "example/tanstack-query", "example/custom-server", "example/localization"]') || fromJSON(format('["{0}"]', github.ref_name)) }}
    concurrency:
      group: ${{ matrix.branch }}-check-example
      cancel-in-progress: true

    steps:
      # Establish origin and checkout credentials before probing the target branch.
      - uses: actions/checkout@v4

      - name: Check branch exists
        id: branch
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Unable to check branch $BRANCH (git exit $status)." >&2
              exit "$status"
            fi
            echo "Branch $BRANCH does not exist yet; skipping."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.branch.outputs.exists == 'true'
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-node@v4
        if: steps.branch.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.ENABLE_CACHE == 'yes' && 'npm' || '' }}

      - name: Install dependencies
        if: steps.branch.outputs.exists == 'true'
        run: npm ci --ignore-scripts

      - name: Commit lint latest title
        if: steps.branch.outputs.exists == 'true'
        run: git log -1 --format=%s | npx --no-install commitlint -g commitlint.config.js

      - name: Check eslint
        if: steps.branch.outputs.exists == 'true'
        run: npm run lint:check

      - name: Typescript check
        if: steps.branch.outputs.exists == 'true'
        run: npm run ts:check

      - name: Stylelint check
        if: steps.branch.outputs.exists == 'true'
        run: npm run style:check

      - name: Build check
        if: steps.branch.outputs.exists == 'true'
        run: npm run build -- --throw-warnings

      - name: Client size budget
        if: steps.branch.outputs.exists == 'true'
        run: npm run size:check

      - name: Smoke check
        if: steps.branch.outputs.exists == 'true'
        run: npm run smoke

  lighthouse:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: prod
            artifact: prod
            urls: ['http://127.0.0.1:4173/', 'http://127.0.0.1:4173/details']
          - branch: example/minimal
            artifact: minimal
            urls: ['http://127.0.0.1:4173/', 'http://127.0.0.1:4173/about']
    defaults:
      run:
        working-directory: app
    steps:
      # Keep the workflow's Lighthouse tools available when checking out an example.
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ env.ENABLE_CACHE == 'yes' && 'npm' || '' }}
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build -- --throw-warnings --unlock-robots

      - name: Run Lighthouse
        env:
          LIGHTHOUSE_URLS: ${{ toJSON(matrix.urls) }}
        run: |
          set -m
          npm run start:ssr -- --port 4173 > "$RUNNER_TEMP/lighthouse-server.log" 2>&1 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lighthouse-server.log"
              exit 1
            fi
            if [ "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 2 http://127.0.0.1:4173/ || true)" = 200 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/lighthouse-server.log"
            echo 'Production server did not return HTTP 200.' >&2
            exit 1
          fi
          npx --yes @lhci/cli@0.15.1 autorun --config=../lighthouserc.cjs --upload.target=temporary-public-storage

      - name: Summarize Lighthouse scores
        if: always()
        run: node ../scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.artifact }}
          path: app/.lighthouseci
          include-hidden-files: true
          if-no-files-found: warn
